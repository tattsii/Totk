name: Build TOTK IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 240
    steps:
      - name: Подключение файлов репозитория (.torrent и prod.keys)
        uses: actions/checkout@v4

      - name: Освобождение места на диске
        run: |
          ACTIVE_XCODE=$(xcode-select -p | sed 's|/Contents/Developer||')
          for app in /Applications/Xcode*.app; do
            if [ "$app" != "$ACTIVE_XCODE" ]; then
              sudo rm -rf "$app"
            fi
          done
          sudo rm -rf ~/Library/Android /Library/Frameworks/Mono.framework /opt/hostedtoolcache
          df -h

      - name: Установка зависимостей и Metal Toolchain
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          xcodebuild -downloadComponent MetalToolchain || true
          brew install xcodegen zstd spirv-cross glslang aria2
          if ! command -v dotnet &> /dev/null; then
            brew install --cask dotnet-sdk
          fi
          python3 -m pip install --break-system-packages lz4 capstone fonttools nsz "backports.zstd; python_version < '3.14'"

      - name: Клонирование официального nxnative
        run: |
          git clone https://github.com/seedds/nxnative.git

      - name: Скачивание игры через торрент
        run: |
          mkdir -p ~/TOTK_Game
          mkdir -p ~/torrent_dl

          # 1. Копируем prod.keys из корня репозитория в домашнюю папку
          cp -f prod.keys ~/prod.keys
          ls -lh ~/prod.keys

          # 2. Находим торрент-файл и качаем базу [v0] + свежий патч [v720896] с публичными трекерами
          TORRENT_FILE=$(find . -maxdepth 1 -name "*.torrent" | head -n 1)
          echo "Качаем по торрент-файлу: $TORRENT_FILE"
          
          TRACKERS="udp://tracker.opentrackr.org:1337/announce,udp://open.stealth.si:80/announce,udp://tracker.torrent.eu.org:451/announce,udp://exodus.desync.com:6969/announce,http://bt2.t-ru.org/ann"
          
          aria2c \
            --select-file=1,2 \
            --seed-time=0 \
            --bt-enable-lpd=true \
            --enable-dht=true \
            --enable-peer-exchange=true \
            --bt-tracker="$TRACKERS" \
            --bt-max-peers=150 \
            --max-connection-per-server=16 \
            --summary-interval=15 \
            -d ~/torrent_dl \
            "$TORRENT_FILE"

          # 3. Удаляем папку со старым патчем и переносим только нужные .nsp в ~/TOTK_Game
          rm -rf "~/torrent_dl/Old Update for Old Firmwares"
          find ~/torrent_dl -type f -name "*.nsp" ! -name "*v393216*" -exec mv -f {} ~/TOTK_Game/ \;
          rm -rf ~/torrent_dl

          echo "Файлы в папке ~/TOTK_Game перед сборкой:"
          ls -lh ~/TOTK_Game

      - name: Сборка IPA
        run: |
          cd nxnative
          python3 scripts/build_ipa_from_nsp.py ~/TOTK_Game -k ~/prod.keys --show-fps
          rm -f ~/TOTK_Game/*.nsp ~/TOTK_Game/*.xci ~/TOTK_Game/*.nsz
          ls -lh ~/TOTK_Game

      - name: Выгрузка готового IPA
        uses: actions/upload-artifact@v4
        with:
          name: TOTK-Native-iOS-IPA
          path: |
            ~/TOTK_Game/*.ipa
            ~/TOTK_Game/*.idx
          compression-level: 0
          retention-days: 1
