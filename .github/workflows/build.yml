name: Build TOTK IPA (Torrent + GitHub Artifacts)

on:
  workflow_dispatch:

concurrency:
  group: build-totk
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 240
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # 1. Ставим Xcode. Пробуем latest-stable, т.к. 27.1 может не быть.
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Verify Xcode
        run: |
          xcodebuild -version
          xcode-select -p

      # 2. Освобождаем место (твой код, оставляем)
      - name: Free disk space
        run: |
          ACTIVE_XCODE=$(xcode-select -p | sed 's|/Contents/Developer||')
          for app in /Applications/Xcode*.app; do
            if [ "$app" != "$ACTIVE_XCODE" ]; then
              sudo rm -rf "$app"
            fi
          done
          sudo rm -rf ~/Library/Android /Library/Frameworks/Mono.framework /opt/hostedtoolcache
          df -h

      # 3. Зависимости (твой код, оставляем)
      - name: Install dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          xcodebuild -downloadComponent MetalToolchain || true
          brew install xcodegen zstd glslang aria2
          if ! command -v dotnet &> /dev/null; then
            brew install --cask dotnet-sdk
          fi
          python3 -m pip install --break-system-packages lz4 "capstone>=5,<6" fonttools nsz zbic "backports.zstd; python_version < '3.14'"

      # 4. Клонируем
      - name: Clone nxnative
        run: git clone --recurse-submodules https://github.com/seedds/nxnative.git

      # 5. Качаем игру (твой код, оставляем как есть)
      - name: Download game & keys
        run: |
          set -euo pipefail
          mkdir -p ~/TOTK_Game ~/torrent_dl
          cp -f prod.keys ~/prod.keys
          TORRENT_FILE=$(find . -maxdepth 1 -name "*.torrent" | head -n 1)
          TRACKERS="udp://tracker.opentrackr.org:1337/announce,udp://open.stealth.si:80/announce,udp://tracker.torrent.eu.org:451/announce,udp://exodus.desync.com:6969/announce,http://bt2.t-ru.org/ann"
          aria2c --select-file=1,2 --seed-time=0 --enable-dht=true --enable-peer-exchange=true \
            --bt-tracker="$TRACKERS" --bt-max-peers=150 --max-connection-per-server=16 \
            -d ~/torrent_dl "$TORRENT_FILE"
          find ~/torrent_dl -type f -name "*.nsp" ! -name "*v393216*" -exec cp -f {} ~/TOTK_Game/ \;
          rm -rf ~/torrent_dl
          ls -lh ~/TOTK_Game

      # 6. СБОРКА. Убрали хардкод пути!
      - name: Build IPA
        run: |
          set -euo pipefail
          # Xcode уже выбран setup-xcode. Просто проверяем.
          xcode-select -p
          cd nxnative
          python3 scripts/build_ipa_from_nsp.py ~/TOTK_Game -k ~/prod.keys \
            --romfs separate --keep-extracted \
            --show-fps --allow-other-metal \
            -o ~/TOTK_Game/TOTK.ipa --app-name "TOTK" 2>&1 | tee ~/build.log

      # 7. Артефакты (твой код)
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TOTK-IPA-Bundle
          path: |
            ~/TOTK_Game/TOTK.ipa
            ~/TOTK_Game/**/*.img
          if-no-files-found: error

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ~/build.log
          if-no-files-found: ignore

      - name: Cleanup keys
        if: always()
        run: rm -f ~/prod.keys
