name: Build TOTK IPA (Torrent + GitHub Artifacts)

on:
  workflow_dispatch:

concurrency:
  group: build-totk
  cancel-in-progress: true

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 240
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # 1. Жестко проверяем Xcode
      - name: Verify and Select Xcode 27.1
        run: |
          if [ ! -d "/Applications/Xcode.app" ]; then
            echo "::error::Xcode.app not found! Available Xcodes:"
            ls -d /Applications/Xcode*.app || true
            exit 1
          fi
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          echo "Selected Xcode:"
          xcodebuild -version
          # Проверяем, что это именно 27.x
          if ! xcodebuild -version | grep -q "Xcode 27"; then
            echo "::error::Wrong Xcode version! Need 27.1"
            exit 1
          fi

      # 2. Освобождение места
      - name: Free disk space
        run: |
          ACTIVE_XCODE=$(xcode-select -p | sed 's|/Contents/Developer||')
          for app in /Applications/Xcode*.app; do
            if [ "$app" != "$ACTIVE_XCODE" ]; then
              sudo rm -rf "$app"
            fi
          done
          sudo rm -rf ~/Library/Android /Library/Frameworks/Mono.framework /opt/hostedtoolcache
          df -h

      # 3. Зависимости
      - name: Install dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          xcodebuild -downloadComponent MetalToolchain || true
          brew install xcodegen zstd glslang aria2
          if ! command -v dotnet &> /dev/null; then
            brew install --cask dotnet-sdk
          fi
          python3 -m pip install --break-system-packages lz4 "capstone>=5,<6" fonttools nsz zbic "backports.zstd; python_version < '3.14'"

      # 4. Клонирование
      - name: Clone nxnative
        run: git clone --recurse-submodules https://github.com/seedds/nxnative.git

      # 5. Скачивание игры
      - name: Download game & keys
        run: |
          set -euo pipefail
          mkdir -p ~/TOTK_Game ~/torrent_dl
          
          if [ ! -f "prod.keys" ]; then
            echo "::error::prod.keys not found!"
            exit 1
          fi
          cp -f prod.keys ~/prod.keys
          
          TORRENT_FILE=$(find . -maxdepth 1 -name "*.torrent" | head -n 1)
          if [ -z "$TORRENT_FILE" ]; then
            echo "::error::.torrent file not found!"
            exit 1
          fi
          
          TRACKERS="udp://tracker.opentrackr.org:1337/announce,udp://open.stealth.si:80/announce,udp://tracker.torrent.eu.org:451/announce,udp://exodus.desync.com:6969/announce,http://bt2.t-ru.org/ann"
          
          aria2c \
            --select-file=1,2 \
            --seed-time=0 \
            --bt-enable-lpd=true \
            --enable-dht=true \
            --enable-peer-exchange=true \
            --bt-tracker="$TRACKERS" \
            --bt-max-peers=150 \
            --max-connection-per-server=16 \
            -d ~/torrent_dl \
            "$TORRENT_FILE"

          find ~/torrent_dl -type f -name "*.nsp" ! -name "*v393216*" -exec cp -f {} ~/TOTK_Game/ \;
          rm -rf ~/torrent_dl
          ls -lh ~/TOTK_Game

      # 6. СБОРКА (с принудительным выбором Xcode перед запуском)
      - name: Build IPA
        run: |
          set -euo pipefail
          
          # СНОВА принудительно выбираем Xcode (на случай, если предыдущий шаг сбил)
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcode-select -p
          
          cd nxnative
          # Запускаем сборку. Если упадёт, tee сохранит лог, но скрипт завершится с ошибкой
          python3 scripts/build_ipa_from_nsp.py ~/TOTK_Game -k ~/prod.keys \
            --romfs separate --keep-extracted \
            --show-fps --allow-other-metal \
            -o ~/TOTK_Game/TOTK.ipa --app-name "TOTK" 2>&1 | tee ~/build.log

      # 7. Выгрузка (если сборка упала, сюда не дойдет, но лог сохранится)
      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TOTK-IPA-Bundle
          path: |
            ~/TOTK_Game/TOTK.ipa
            ~/TOTK_Game/**/*.img
          if-no-files-found: error

      # 8. Логи (всегда, даже при падении)
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            ~/build.log
            ~/TOTK_Game/*_build/**/*.log
          if-no-files-found: ignore

      # 9. Очистка
      - name: Cleanup keys
        if: always()
        run: rm -f ~/prod.keys
