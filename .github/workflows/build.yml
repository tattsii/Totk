name: Build TOTK IPA (Torrent + GitHub Artifacts)

on:
  workflow_dispatch:

concurrency:
  group: build-totk
  cancel-in-progress: true

jobs:
  build:
    # Используем образ с Xcode 27
    runs-on: xcode-27
    timeout-minutes: 240
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # 1. Умный поиск и выбор Xcode
      - name: Find and Select Xcode
        run: |
          # Ищем любой Xcode в папке Applications
          REAL_XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1)
          
          if [ -z "$REAL_XCODE" ]; then
            echo "::error::No Xcode found on runner!"
            ls -la /Applications/ | grep -i xcode || true
            exit 1
          fi
          
          echo "Found Xcode at: $REAL_XCODE"
          
          # Переключаемся на него
          sudo xcode-select -s "$REAL_XCODE/Contents/Developer"
          
          echo "Selected Xcode:"
          xcodebuild -version
          xcode-select -p

      # 2. Освобождение места
      - name: Free disk space
        run: |
          ACTIVE_XCODE=$(xcode-select -p | sed 's|/Contents/Developer||')
          for app in /Applications/Xcode*.app; do
            if [ "$app" != "$ACTIVE_XCODE" ]; then
              sudo rm -rf "$app"
            fi
          done
          sudo rm -rf ~/Library/Android /Library/Frameworks/Mono.framework /opt/hostedtoolcache
          df -h

      # 3. Зависимости
      - name: Install dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          xcodebuild -downloadComponent MetalToolchain || true
          brew install xcodegen zstd glslang aria2
          if ! command -v dotnet &> /dev/null; then
            brew install --cask dotnet-sdk
          fi
          python3 -m pip install --break-system-packages lz4 "capstone>=5,<6" fonttools nsz zbic "backports.zstd; python_version < '3.14'"

      # 4. Клонирование
      - name: Clone nxnative
        run: git clone --recurse-submodules https://github.com/seedds/nxnative.git

      # 5. Скачивание игры
      - name: Download game & keys
        run: |
          set -euo pipefail
          mkdir -p ~/TOTK_Game ~/torrent_dl
          
          if [ ! -f "prod.keys" ]; then
            echo "::error::prod.keys not found!"
            exit 1
          fi
          cp -f prod.keys ~/prod.keys
          
          TORRENT_FILE=$(find . -maxdepth 1 -name "*.torrent" | head -n 1)
          if [ -z "$TORRENT_FILE" ]; then
            echo "::error::.torrent file not found!"
            exit 1
          fi
          
          TRACKERS="udp://tracker.opentrackr.org:1337/announce,udp://open.stealth.si:80/announce,udp://tracker.torrent.eu.org:451/announce,udp://exodus.desync.com:6969/announce,http://bt2.t-ru.org/ann"
          
          aria2c \
            --select-file=1,2 \
            --seed-time=0 \
            --bt-enable-lpd=true \
            --enable-dht=true \
            --enable-peer-exchange=true \
            --bt-tracker="$TRACKERS" \
            --bt-max-peers=150 \
            --max-connection-per-server=16 \
            -d ~/torrent_dl \
            "$TORRENT_FILE"

          find ~/torrent_dl -type f -name "*.nsp" ! -name "*v393216*" -exec cp -f {} ~/TOTK_Game/ \;
          rm -rf ~/torrent_dl
          ls -lh ~/TOTK_Game

      # 6. СБОРКА IPA (умный выбор Xcode через DEVELOPER_DIR)
      - name: Build IPA
        run: |
          set -euo pipefail
          
          # Снова находим Xcode (на случай, если предыдущий шаг что-то сбил)
          REAL_XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$REAL_XCODE" ]; then
            echo "::error::No Xcode found!"
            exit 1
          fi
          
          # Используем DEVELOPER_DIR, это надежнее, чем xcode-select
          export DEVELOPER_DIR="$REAL_XCODE/Contents/Developer"
          echo "Using DEVELOPER_DIR: $DEVELOPER_DIR"
          
          # Проверяем версию
          "$DEVELOPER_DIR/usr/bin/xcodebuild" -version
          
          cd nxnative
          python3 scripts/build_ipa_from_nsp.py ~/TOTK_Game -k ~/prod.keys \
            --romfs separate --keep-extracted \
            --show-fps --allow-other-metal \
            -o ~/TOTK_Game/TOTK.ipa --app-name "TOTK" 2>&1 | tee ~/build.log

      # 7. Выгрузка артефактов
      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TOTK-IPA-Bundle
          path: |
            ~/TOTK_Game/TOTK.ipa
            ~/TOTK_Game/**/*.img
          if-no-files-found: error

      # 8. Логи
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            ~/build.log
            ~/TOTK_Game/*_build/**/*.log
          if-no-files-found: ignore

      # 9. Очистка ключей
      - name: Cleanup keys
        if: always()
        run: rm -f ~/prod.keys
