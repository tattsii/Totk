name: Build TOTK IPA

on:
  workflow_dispatch:

concurrency:
  group: build-totk
  cancel-in-progress: true

jobs:
  build:
    # Берем образ, где точно есть Xcode 27
    runs-on: xcode-27
    timeout-minutes: 240
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # 1. Находим Xcode и запоминаем его путь
      - name: Setup Xcode
        run: |
          # Ищем любой Xcode (например, Xcode_27.2.0.app)
          REAL_XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1)
          
          if [ -z "$REAL_XCODE" ]; then
            echo "::error::Xcode не найден на сервере!"
            exit 1
          fi
          
          echo "Найден Xcode: $REAL_XCODE"
          
          # Переключаемся на него
          sudo xcode-select -s "$REAL_XCODE/Contents/Developer"
          
          # Сохраняем путь в переменную окружения для следующих шагов
          echo "DEVELOPER_DIR=$REAL_XCODE/Contents/Developer" >> $GITHUB_ENV
          
          xcodebuild -version

      # 2. Очистка диска (БЕЗ удаления Xcode!)
      - name: Free disk space
        run: |
          # Убираем только мусор, чтобы не сломать сборку
          sudo rm -rf ~/Library/Android /Library/Frameworks/Mono.framework /opt/hostedtoolcache
          df -h

      # 3. Ставим зависимости
      - name: Install dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          xcodebuild -downloadComponent MetalToolchain || true
          brew install xcodegen zstd glslang aria2
          if ! command -v dotnet &> /dev/null; then
            brew install --cask dotnet-sdk
          fi
          python3 -m pip install --break-system-packages lz4 "capstone>=5,<6" fonttools nsz zbic "backports.zstd; python_version < '3.14'"

      # 4. Клонируем движок
      - name: Clone nxnative
        run: git clone --recurse-submodules https://github.com/seedds/nxnative.git

      # 5. Качаем игру и ключи
      - name: Download game & keys
        run: |
          set -euo pipefail
          mkdir -p ~/TOTK_Game ~/torrent_dl
          
          if [ ! -f "prod.keys" ]; then
            echo "::error::prod.keys не найден в корне репозитория!"
            exit 1
          fi
          cp -f prod.keys ~/prod.keys
          
          TORRENT_FILE=$(find . -maxdepth 1 -name "*.torrent" | head -n 1)
          if [ -z "$TORRENT_FILE" ]; then
            echo "::error::.torrent файл не найден в корне репозитория!"
            exit 1
          fi
          
          TRACKERS="udp://tracker.opentrackr.org:1337/announce,udp://open.stealth.si:80/announce,udp://tracker.torrent.eu.org:451/announce,udp://exodus.desync.com:6969/announce,http://bt2.t-ru.org/ann"
          
          aria2c \
            --select-file=1,2 \
            --seed-time=0 \
            --bt-enable-lpd=true \
            --enable-dht=true \
            --enable-peer-exchange=true \
            --bt-tracker="$TRACKERS" \
            --bt-max-peers=150 \
            --max-connection-per-server=16 \
            -d ~/torrent_dl \
            "$TORRENT_FILE"

          find ~/torrent_dl -type f -name "*.nsp" ! -name "*v393216*" -exec cp -f {} ~/TOTK_Game/ \;
          rm -rf ~/torrent_dl
          ls -lh ~/TOTK_Game

      # 6. СБОРКА (использует путь, который мы сохранили в DEVELOPER_DIR)
      - name: Build IPA
        run: |
          set -euo pipefail
          
          echo "Сборка с использованием: $DEVELOPER_DIR"
          # Проверяем, что Xcode на месте
          if [ ! -f "$DEVELOPER_DIR/usr/bin/xcodebuild" ]; then
             echo "::error::xcodebuild не найден по пути $DEVELOPER_DIR/usr/bin/xcodebuild"
             exit 1
          fi
          
          "$DEVELOPER_DIR/usr/bin/xcodebuild" -version
          
          cd nxnative
          python3 scripts/build_ipa_from_nsp.py ~/TOTK_Game -k ~/prod.keys \
            --romfs separate --keep-extracted \
            --show-fps --allow-other-metal \
            -o ~/TOTK_Game/TOTK.ipa --app-name "TOTK" 2>&1 | tee ~/build.log

      # 7. Выгрузка результатов
      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TOTK-IPA-Bundle
          path: |
            ~/TOTK_Game/TOTK.ipa
            ~/TOTK_Game/**/*.img
          if-no-files-found: error

      # 8. Выгрузка логов (если что-то пойдет не так)
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            ~/build.log
            ~/TOTK_Game/*_build/**/*.log
          if-no-files-found: ignore

      # 9. Удаляем ключи для безопасности
      - name: Cleanup keys
        if: always()
        run: rm -f ~/prod.keys
